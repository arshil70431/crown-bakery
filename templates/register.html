{% extends 'base.html' %}

{% block title %}Register – Crown Bakery{% endblock %}

{% block content %}
<div class="container">
    <div class="section-title">
        <h2>Create an Account</h2>
        <p>Join our bakery community for exclusive offers and faster checkout</p>
    </div>

    <div class="form-container">
        <form id="registerForm">
            <div class="form-group">
                <label for="reg-name">Full Name</label>
                <input type="text" id="reg-name" placeholder="Enter your full name" required>
            </div>
            <div class="form-group">
                <label for="reg-email">Email Address</label>
                <input type="email" id="reg-email" placeholder="Enter your email" required>
            </div>
            <div class="form-group">
                <label for="reg-phone">Phone Number</label>
                <input type="tel" id="reg-phone" placeholder="Enter your phone number">
            </div>
            <div class="form-group">
                <label for="reg-password">Password</label>
                <input type="password" id="reg-password" placeholder="Create a password" required>
            </div>
            <div class="form-group">
                <label for="reg-confirm">Confirm Password</label>
                <input type="password" id="reg-confirm" placeholder="Confirm your password" required>
            </div>
            <button type="submit" class="btn" style="width:100%;">Register</button>
            <p style="text-align:center;margin-top:15px;">Already have an account? <a href="{{ url_for('login') }}" style="color:var(--primary);">Login here</a></p>
        </form>
    </div>
</div>
{% endblock %}
