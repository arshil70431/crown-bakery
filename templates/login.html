{% extends 'base.html' %}

{% block title %}Login – Crown Bakery{% endblock %}

{% block content %}
<div class="container">
    <div class="section-title">
        <h2>Login to Your Account</h2>
        <p>Access your bakery account to track orders and save favorites</p>
    </div>

    <div class="form-container">
        <form id="loginForm">
            <div class="form-group">
                <label for="login-email">Email Address</label>
                <input type="email" id="login-email" placeholder="Enter your email" required>
            </div>
            <div class="form-group">
                <label for="login-password">Password</label>
                <input type="password" id="login-password" placeholder="Enter your password" required>
            </div>
            <button type="submit" class="btn" style="width:100%;">Login</button>
            <p style="text-align:center;margin-top:15px;">Don't have an account? <a href="{{ url_for('register') }}" style="color:var(--primary);">Register here</a></p>
        </form>
    </div>
</div>
{% endblock %}
